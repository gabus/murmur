<?xml version="1.0" encoding="UTF-8"?>
<!-- murmur app icon. Same microphone as the tray icons in src/icons.rs (24 px grid scaled
     ×4, offset 16): red capsule filled to a voice level, grey holder, stem and base.
     Render the 128 px PNG with: rsvg-convert -w 128 -h 128 -o io.github.gabus.Murmur-128.png io.github.gabus.Murmur.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e7ea"/>
    </linearGradient>
    <clipPath id="capsule">
      <rect x="50" y="24" width="28" height="48" rx="14"/>
    </clipPath>
  </defs>
  <!-- tile with a darker bottom lip -->
  <rect x="8" y="12" width="112" height="108" rx="26" fill="#c6c8cd"/>
  <rect x="8" y="8" width="112" height="108" rx="26" fill="url(#bg)"/>
  <!-- capsule: dim red body, solid red level fill from the bottom -->
  <g clip-path="url(#capsule)">
    <rect x="50" y="24" width="28" height="48" fill="#de2e2e" fill-opacity="0.45"/>
    <rect x="50" y="44" width="28" height="28" fill="#de2e2e"/>
  </g>
  <!-- holder (U), stem and base -->
  <path d="M40 54.4 V58 A24 24 0 0 0 88 58 V54.4" fill="none" stroke="#8c9199"
        stroke-width="7.2" stroke-linecap="round"/>
  <rect x="60.4" y="82" width="7.2" height="14" fill="#8c9199"/>
  <rect x="48" y="94.4" width="32" height="6.4" rx="3.2" fill="#8c9199"/>
</svg>
