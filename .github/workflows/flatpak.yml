# Builds the Flatpak bundle (offline, from source: see io.github.gabus.Murmur.yml) and uploads
# murmur.flatpak as a workflow artifact. The action caches .flatpak-builder (keyed on the
# manifest, falling back to the newest cache), so ONNX Runtime is rebuilt only when needed.
name: Flatpak

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: io.github.gabus.Murmur.yml
          bundle: murmur.flatpak
          upload-artifact: true
