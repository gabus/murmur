[package]
name = "murmur"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Live voice dictation for Wayland"

[dependencies]
hound = { version = "3", optional = true }
anyhow = "1.0.104"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast", "clipboard", "notification", "background"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
futures-util = "0.3.34"
reis = { version = "0.7", features = ["tokio"] }
rustix = { version = "1", features = ["time"] }
sherpa-onnx = "2.0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xkbcommon = "0.9"
ksni = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
tar = "0.4"
bzip2 = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
zbus = { version = "6", default-features = false, features = ["tokio"] }

[dev-dependencies]
hound = "3"

[features]
# Test-only hooks: WAV instead of mic, direct KWin EIS, autorun. Never shipped.
dev-harness = ["dep:hound"]
