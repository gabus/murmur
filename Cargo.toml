[package]
name = "murmur"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = { version = "3", optional = true }
anyhow = "1.0.104"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast", "clipboard", "notification"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
futures-util = "0.3.34"
reis = { version = "0.7", features = ["tokio"] }
rustix = { version = "1", features = ["time"] }
sherpa-onnx = "2.0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xkbcommon = "0.9"
ksni = "0.3"

[dev-dependencies]
hound = "3"

[features]
# Test-only hooks: WAV instead of mic, direct KWin EIS, autorun. Never shipped.
dev-harness = ["dep:hound"]
