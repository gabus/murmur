# murmur Flatpak manifest. Builds fully offline and from source: ONNX Runtime and the
# sherpa-onnx C API are separate modules, and the Rust crates are vendored through
# flatpak/cargo-sources.json (regenerate it whenever Cargo.lock changes, see README).
#   flatpak run org.flatpak.Builder --user --install --force-clean --sandbox \
#     --state-dir=.flatpak-builder build-dir io.github.gabus.Murmur.yml
id: io.github.gabus.Murmur
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: murmur
finish-args:
  - --socket=wayland
  - --socket=pulseaudio                         # microphone
  - --share=network                             # model download only
  - --talk-name=org.kde.StatusNotifierWatcher   # tray icon
  # cpal's pure-Rust PulseAudio client sends an empty auth cookie when none is
  # found (the sandbox has none); pipewire-pulse rejects that with "Invalid", so
  # point it at a 256-byte zero cookie like libpulse would send.
  - --env=PULSE_COOKIE=/app/share/murmur/pulse-cookie
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'
modules:
  - flatpak/onnxruntime.yml
  - flatpak/sherpa-onnx.yml

  - name: murmur
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/murmur/cargo
        CARGO_NET_OFFLINE: 'true'
        # sherpa-onnx-sys links the C API built above instead of downloading prebuilt libs.
        SHERPA_ONNX_LIB_DIR: /app/lib
    build-commands:
      - cargo --offline build --release --locked --no-default-features --features sherpa-shared
      - install -Dm755 target/release/murmur -t /app/bin
      - install -d /app/share/murmur && head -c 256 /dev/zero > /app/share/murmur/pulse-cookie
      - install -Dm644 data/io.github.gabus.Murmur.desktop -t /app/share/applications
      - install -Dm644 data/io.github.gabus.Murmur.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/io.github.gabus.Murmur.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/icons/io.github.gabus.Murmur-128.png /app/share/icons/hicolor/128x128/apps/io.github.gabus.Murmur.png
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .claude
          - .idea
          - .flatpak-builder
          - build-dir
          - repo
          - target
          - spike
      - flatpak/cargo-sources.json
