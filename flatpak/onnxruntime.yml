# ONNX Runtime, CPU only, built from source as a shared library (libonnxruntime.so).
# sherpa-onnx 2.0.1 is released against ORT 1.28.2; 1.28.3 is a patch release on top of it
# (memory-safety and model-validation fixes, same ABI).
#
# Offline build: ORT's CMake reads its dependencies from cmake/deps.txt and, for every
# https:// URL, first looks for the same path under onnxruntime_CMAKE_DEPS_MIRROR_DIR
# (default: <source>/mirror). Each archive below is placed there, so FetchContent unpacks
# the local copy (still checking deps.txt's SHA1) and applies ORT's own patches.
# FETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER keeps it from picking up SDK copies of the
# same libraries in other versions.
#
# The archive list is exactly what this configuration fetches (see docs/packaging.md for how
# to regenerate it when bumping ORT).
name: onnxruntime
buildsystem: cmake-ninja
subdir: cmake
builddir: true
# No debug info (-g0 overrides the SDK's -g): with it, ONNX Runtime's objects alone filled a
# GitHub runner's ~14 GB disk ("No space left on device", 2026-11-11). Nothing uses it; the
# SDK's hardening flags stay.
no-debuginfo: true
build-options:
  cflags: -g0
  cxxflags: -g0
config-opts:
  # GCC 16 (SDK 26.08) adds warnings ORT treats as errors (COMPILE_WARNING_AS_ERROR).
  - --compile-no-warning-as-error
  - -DCMAKE_BUILD_TYPE=Release
  - -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER
  - -Donnxruntime_BUILD_SHARED_LIB=ON
  - -Donnxruntime_BUILD_UNIT_TESTS=OFF
  - -Donnxruntime_BUILD_BENCHMARKS=OFF
  - -Donnxruntime_RUN_ONNX_TESTS=OFF
  - -Donnxruntime_ENABLE_PYTHON=OFF
  - -Donnxruntime_ENABLE_TRAINING=OFF
  - -Donnxruntime_USE_CUDA=OFF
  - -Donnxruntime_USE_XNNPACK=OFF
  - -Donnxruntime_USE_MIMALLOC=OFF
  - -Donnxruntime_USE_TELEMETRY=OFF
  - -Donnxruntime_ENABLE_CPUINFO=ON
  # Match Microsoft's release builds (build.py passes OFF unless --disable_rtti).
  - -Donnxruntime_DISABLE_RTTI=OFF
# ThirdPartyNotices.txt covers the libraries linked in statically (abseil, protobuf, onnx, ...).
license-files:
  - LICENSE
  - ThirdPartyNotices.txt
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
