# sherpa-onnx C API (libsherpa-onnx-c-api.so), built from source against the ONNX Runtime
# module (flatpak/onnxruntime.yml). The `sherpa-onnx` Rust crate links it with its `shared`
# feature and SHERPA_ONNX_LIB_DIR=/app/lib (murmur's `sherpa-shared` feature).
#
# Offline build: each dependency's cmake/*.cmake looks for its archive in
# ${CMAKE_SOURCE_DIR}/<file> before downloading, so the archives below sit in the source root.
# Versions and hashes are the ones pinned in sherpa-onnx 2.0.1's cmake/*.cmake (kissfft is
# pinned by kaldi-native-fbank, kaldifst by kaldi-decoder).
name: sherpa-onnx
buildsystem: cmake-ninja
builddir: true
build-options:
  env:
    # Use the ONNX Runtime built in the previous module (cmake/onnxruntime.cmake).
    SHERPA_ONNXRUNTIME_INCLUDE_DIR: /app/include/onnxruntime
    SHERPA_ONNXRUNTIME_LIB_DIR: /app/lib
config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DBUILD_SHARED_LIBS=ON
  - -DSHERPA_ONNX_ENABLE_C_API=ON
  - -DSHERPA_ONNX_USE_PRE_INSTALLED_ONNXRUNTIME_IF_AVAILABLE=ON
  # Speech recognition, VAD and punctuation only. TTS and diarization C functions remain
  # as stubs that log an error, so the Rust crate still links.
  - -DSHERPA_ONNX_ENABLE_TTS=OFF
  - -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF
  - -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF
  - -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF
  - -DSHERPA_ONNX_ENABLE_PYTHON=OFF
  - -DSHERPA_ONNX_ENABLE_JNI=OFF
  - -DSHERPA_ONNX_ENABLE_GPU=OFF
  - -DSHERPA_ONNX_ENABLE_TESTS=OFF
  - -DSHERPA_ONNX_ENABLE_BINARY=OFF
  - -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF
post-install:
  # License files of the libraries compiled into libsherpa-onnx-c-api.so (kaldi-native-fbank,
  # kissfft, kaldi-decoder, kaldifst, openfst, utf8proc, simple-sentencepiece, and the
  # header-only eigen and nlohmann json). flatpak-builder installs sherpa-onnx's own LICENSE.
  # post-install runs in the CMake build directory (_flatpak_build).
  - |
    for src in _deps/*-src; do
      name=$(basename "$src" -src)
      for f in "$src"/LICENSE* "$src"/COPYING* "$src"/LICENSES/*; do
        if [ -f "$f" ]; then
          install -Dm644 "$f" "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/sherpa-onnx/deps/$name/$(basename "$f")"
        fi
      done
    done
    test -n "$(ls "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/sherpa-onnx/deps")"
cleanup:
  - /include
  - /sherpa-onnx.pc
  # murmur uses the C API only.
  - /lib/libsherpa-onnx-cxx-api.so
